[project]
name = "revive-catalog-pipeline"
version = "0.1.0"
description = "Python pipeline scaffold and S4 pricing-page registry"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-socket==0.7.0", "ruff==0.13.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
