name: Pipeline CI
on:
  pull_request:
    paths: ['pipeline/**', '.github/workflows/pipeline-ci.yml', 'S4-repair-price-pages.json', 'S3-failure-taxonomy.md']
  push:
    branches: [main]
    paths: ['pipeline/**', '.github/workflows/pipeline-ci.yml', 'S4-repair-price-pages.json', 'S3-failure-taxonomy.md']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.22
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
