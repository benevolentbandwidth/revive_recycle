name: PR Description Check

# Enforce a minimum quality bar on PR descriptions: the six required sections
# must be present with real content, and Validation must list a command that
# was actually run. Re-runs whenever the description is edited.
on:
  pull_request:
    types: [opened, edited, synchronize]

# Read-only: the script only reads the on-disk event payload.
permissions:
  contents: read
  pull-requests: read

jobs:
  validate-pr-body:
    name: Validate PR description
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate PR body
        run: python .github/scripts/validate-pr-body.py
